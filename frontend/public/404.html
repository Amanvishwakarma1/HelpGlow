<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HelpGlow Foundation</title>
    <script>
      // Single Page Application (SPA) client-side routing fallback redirect
      (function() {
        var path = window.location.pathname + window.location.search + window.location.hash;
        window.location.replace('/' + (path.startsWith('/') ? path.substring(1) : path));
      })();
    </script>
  </head>
  <body>
    <script>
      // Fallback reload index.html
      window.location.replace('/index.html');
    </script>
  </body>
</html>
