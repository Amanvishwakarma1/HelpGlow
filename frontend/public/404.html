<!doctype html>
<html lang="en" style="background-color: #0F172A; scroll-behavior: smooth;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F172A" />
    <title>HelpGlow Foundation</title>
    <script>
      // Single Page Application (SPA) route restoration fallback
      var l = window.location;
      var path = l.pathname + l.search + l.hash;
      if (l.pathname && l.pathname !== '/') {
        l.replace('/#' + path);
      } else {
        l.replace('/');
      }
    </script>
  </head>
  <body style="background-color: #0F172A; color: #FFFFFF; font-family: sans-serif; text-align: center; padding-top: 50px;">
    <p>Loading HelpGlow Foundation...</p>
  </body>
</html>
